services:
  - type: web
    runtime: node
    name: nexus-flow-interface
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
